<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Video Player</title>
<style>
:root{--bg:#18181b;--surface:#232326;--surface-2:#2e2e33;--accent:#fff;--accent-2:#e5e5e5;--muted:#a1a1aa;--border:#3a3a40;--err:#e8a0a0;--cap-size:1.2rem;--cap-bg:.7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-color:#52525b transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--accent-2);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
::selection{background:#52525b;color:#fff}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit;outline:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
button{background:none;border:0;cursor:pointer;display:inline-grid;place-items:center;min-width:40px;min-height:40px;border-radius:8px;padding:0}
button:hover{background:rgba(255,255,255,.1)}
@media(pointer:coarse){button{min-width:44px;min-height:44px}}
i[data-ic]{display:grid}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin .i{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-left));min-height:56px}
.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:0 16px;background:var(--surface);border:1px solid var(--border);color:var(--accent-2)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:#fff;color:#18181b;border-color:#fff}.btn.pri:hover{background:#e5e5e5}
main{flex:1;display:grid;align-items:center;padding:0 12px 12px;min-height:0}
/* Stage */
.player{position:relative;width:100%;max-width:1100px;max-height:100%;aspect-ratio:16/9;margin:0 auto;background:#000;overflow:hidden;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.player:fullscreen{max-width:none;max-height:none;border-radius:0;width:100%;height:100%;aspect-ratio:auto}
.player:-webkit-full-screen{max-width:none;max-height:none;border-radius:0;width:100%;height:100%;aspect-ratio:auto}
@media(orientation:landscape)and(max-height:520px){.topbar{display:none}main{padding:0}.player{max-width:none;width:100%;height:100dvh;aspect-ratio:auto;border-radius:0}}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;will-change:opacity;transform:translateZ(0)}
.player:not(.ui).playing{cursor:none}
.ov{position:absolute;pointer-events:none;opacity:0;transition:opacity .18s;background:rgba(0,0,0,.62);color:#fff;border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:8px;will-change:opacity,transform;transform:translateZ(0)}
.ov.on{opacity:1}
.pill{top:16px;left:0;right:0;margin:0 auto;width:fit-content}
.seekov{top:50%;left:0;right:0;margin:-22px auto 0;width:fit-content;font-size:1.4rem;font-variant-numeric:tabular-nums}
.ind{top:50%;margin-top:-80px;flex-direction:column;height:160px;width:52px;border-radius:16px;justify-content:space-between;padding:12px 0}
.ind.l{left:24px}.ind.r{right:24px}
.bar{flex:1;width:4px;margin:8px 0;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;position:relative}
.fill{position:absolute;inset:0;background:#fff;transform-origin:bottom;will-change:transform}
.rip{top:0;bottom:0;width:35%;flex-direction:column;justify-content:center;border-radius:0;background:rgba(255,255,255,.14)}
.rip.l{left:0;border-radius:0 120px 120px 0}.rip.r{right:0;border-radius:120px 0 0 120px}
.sp-wrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
.sp-wrap.on{opacity:1}
.sp-wrap .i{width:44px;height:44px;animation:rot .9s linear infinite}
.empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--muted);padding:16px;background:var(--bg)}
.empty.on{display:flex}.empty .i{width:48px;height:48px}.empty p{margin:0}
.big{position:absolute;top:50%;left:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.4);color:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
.big.on{opacity:1;pointer-events:auto}.big .i{width:32px;height:32px}
.cap{position:absolute;left:0;right:0;bottom:4%;margin:0 auto;width:fit-content;max-width:90%;padding:4px 10px;border-radius:6px;text-align:center;color:#fff;font-size:var(--cap-size);background:rgba(0,0,0,var(--cap-bg));opacity:0;pointer-events:none;transition:transform .2s,opacity .15s;will-change:transform,opacity;white-space:pre-wrap}
.cap.on{opacity:1}.ui .cap{transform:translateY(-72px)}
/* Controls */
.controls{position:absolute;left:0;right:0;bottom:0;padding:28px max(12px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;will-change:transform,opacity}
.ui .controls{opacity:1;transform:none;pointer-events:auto}
.row{display:flex;align-items:center;flex-wrap:wrap}.sp{flex:1}
.time{padding:0 8px;min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.act{background:rgba(255,255,255,.18)}
.seek{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.live .seek{visibility:hidden}
.tr{position:relative;width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.buf,.prog{position:absolute;inset:0}.prog{background:#fff;transform-origin:left;transform:scaleX(0);will-change:transform}
.thumb{position:absolute;left:0;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;opacity:0;will-change:transform}
.seek:hover .thumb,.seek:focus-visible .thumb,.seek.drag .thumb{opacity:1}
.pvb{position:absolute;left:0;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;opacity:0;pointer-events:none;will-change:transform,opacity}
.pvb.on{opacity:1}.pvb canvas{width:160px;height:90px;border-radius:4px;background:#000}.pvb.noimg canvas{display:none}
.pvb span{font-size:12px;font-variant-numeric:tabular-nums;color:#fff;padding:0 6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:80px;height:4px;border-radius:2px;margin:0 8px;cursor:pointer;accent-color:#fff;background:linear-gradient(#fff,#fff) 0/var(--v,100%) 100% no-repeat,rgba(255,255,255,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
@media(max-width:600px){input[type=range]{display:none}}
/* Menu */
.menu{position:absolute;right:12px;bottom:92px;min-width:210px;max-width:calc(100% - 24px);max-height:60%;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;display:none;color:#fff}
.menu.open{display:block}
.menu .mh{padding:8px 12px;color:var(--muted);font-size:12px}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:16px;padding:8px 12px;text-align:left;min-height:44px}
.menu small{color:var(--muted)}
.toast{position:absolute;top:16px;left:0;right:0;margin:0 auto;width:fit-content;max-width:90%;padding:10px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:#fff;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;text-align:center}
.toast.on{opacity:1}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.card{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}
.card{position:relative}
.card .xbtn{position:absolute;top:10px;right:10px}
.card h2{margin:0 0 6px;font-size:1.25rem;color:#fff}.card p{margin:0 0 16px;color:var(--muted)}
.card input[type=text]{width:100%;height:46px;padding:0 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:#fff}
.card input[type=text]:focus{border-color:#fff}
.err{min-height:20px;margin:8px 0;color:var(--err);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{min-height:44px}.acts .sp{flex:1}
a.btn{text-decoration:none;min-height:40px}
.title{min-width:0;flex:1}
.phead{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:flex-end;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 26px 8px;background:linear-gradient(rgba(0,0,0,.7),transparent);color:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
.phead button{pointer-events:none;background:rgba(0,0,0,.35)}
.ui .phead,.player.embed .phead,.player:has(.empty.on) .phead{opacity:1}
.ui .phead button,.player.embed .phead button,.player:has(.empty.on) .phead button{pointer-events:auto}
.player.embed .phead{background:none}
.menu{z-index:4}
.menu.top{top:56px;bottom:auto}
iframe.embedf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:none}
.player.embed{touch-action:auto}
.player.embed iframe.embedf{display:block}
.player.embed .controls,.player.embed .big,.player.embed .dim,.player.embed .cap,.player.embed video,.player.embed .sp-wrap{display:none!important}
.tb{display:flex;gap:8px;align-items:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header class="topbar">
  <span class="title" id="title" data-empty="1">No video loaded</span>
  <div class="tb"><a class="btn" id="dlBtn" href="#" target="_blank" rel="noopener" hidden><i data-ic="dl"></i><span>Download</span></a><button class="btn" id="loadBtn"><i data-ic="link"></i><span>Load new video</span></button></div>
</header>

<main>
<div class="player" id="player">
  <video id="v" playsinline preload="auto"></video>
  <iframe class="embedf" id="ifr" title="Embedded video" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" src="about:blank"></iframe>
  <div class="dim" id="dim"></div>
  <div class="cap" id="cap" aria-live="off"></div>
  <div class="empty on" id="empty"><i data-ic="play"></i><p>No video loaded</p><p>Paste a YouTube, Facebook, Instagram, Vimeo, TikTok or direct video link, or open a local file.</p><button class="btn pri" id="emptyBtn">Load video</button></div>
  <div class="sp-wrap" id="spin"><i data-ic="loader"></i></div>
  <div class="ov rip l" id="rl"><i data-ic="back"></i><b></b></div>
  <div class="ov rip r" id="rr"><i data-ic="fwd"></i><b></b></div>
  <div class="ov ind r" id="ind"><i id="indIc" data-ic="vhigh"></i><div class="bar"><div class="fill" id="fill"></div></div><span id="indPct">100%</span></div>
  <div class="ov pill" id="pill"><i data-ic="speed"></i><span>2x</span></div>
  <div class="ov seekov" id="seekov"></div>
  <button class="big" id="big" aria-label="Play"><i id="bigIc" data-ic="play"></i></button>
  <div class="controls" id="controls">
    <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="00:00">
      <div class="pvb noimg" id="pvb"><canvas id="cv" width="160" height="90"></canvas><span id="pvt">00:00</span></div>
      <div class="tr"><div class="buf" id="buf"></div><div class="prog" id="prog"></div></div>
      <div class="thumb" id="thumb"></div>
    </div>
    <div class="row">
      <button id="play" aria-label="Play"><i id="playIc" data-ic="play"></i></button>
      <button id="mute" aria-label="Mute"><i id="muteIc" data-ic="vhigh"></i></button>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <button class="time" id="time" aria-label="Toggle elapsed and remaining time">00:00 / 00:00</button>
      <span class="sp"></span>
      <button id="speed" data-menu aria-label="Playback speed" aria-haspopup="menu"><i data-ic="speed"></i></button>
      <button id="ccBtn" data-menu aria-label="Captions" aria-haspopup="menu" aria-pressed="false"><i data-ic="cc"></i></button>

      <button id="pip" aria-label="Picture in picture" hidden><i data-ic="pip"></i></button>
      <button id="rot" aria-label="Rotate to landscape fullscreen"><i data-ic="rotate"></i></button>
      <button id="fs" aria-label="Fullscreen"><i id="fsIc" data-ic="fs"></i></button>
    </div>
  </div>
  <div class="phead"><button id="setBtn" data-menu aria-label="Settings" aria-haspopup="menu"><i data-ic="gear"></i></button></div>
  <div class="menu" id="menu" role="menu"></div>
  <div class="toast" id="toast" role="status"></div>
</div>
</main>
<video id="pv" muted preload="none" playsinline style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" aria-hidden="true" tabindex="-1"></video>

let LANG='en';
const t=k=>(D[LANG]&&D[LANG][k])||k;
function modalText(){const vid=mMode==='video';E('mTitle').textContent=t(vid?'Load a video':'Load subtitles from URL');E('mHelp').textContent=t(vid?HELP:'Paste a direct link to a .vtt or .srt file.');urlIn.placeholder=t(vid?'Paste video link':'Paste subtitle file URL')}
const STATIC=[['#loadBtn span','No video loaded'],['#dlBtn span','Download'],['#emptyBtn','Load video'],['#goBtn','Play'],['#fileBtn span','Choose file'],['#cancelBtn','Cancel']];
const ARIA=[['#xBtn','Close'],['#seek','Seek'],['#vol','Volume'],['#time','Toggle elapsed and remaining time'],['#speed','Playback speed'],['#ccBtn','Captions'],['#audioBtn','Audio track'],['#setBtn','Settings'],['#pip','Picture in picture'],['#rot','Rotate to landscape fullscreen'],['#urlIn','Video URL']];
STATIC[0][1]='Load new video';
function applyLang(){
  document.documentElement.lang=LANG;
  STATIC.forEach(([sel,k])=>{const e=document.querySelector(sel);if(e)e.textContent=t(k)});
  const ps=document.querySelectorAll('#empty p');ps[0].textContent=t('No video loaded');ps[1].textContent=t("Paste a YouTube, Facebook, Instagram, Vimeo, TikTok or direct video link, or open a local file.");
  if(titleEl.dataset.empty)titleEl.textContent=t('No video loaded');
  ARIA.forEach(([sel,k])=>{const e=document.querySelector(sel);if(e)e.setAttribute('aria-label',t(k))});
  modalText();updPlay();syncVol();
  E('fs').setAttribute('aria-label',t(fsEl()?'Exit fullscreen':'Fullscreen'));
  menuEl.classList.remove('open');S.menuKey='';
}
function setLang(l,save){
  LANG=D[l]?l:'en';
  if(save){try{localStorage.setItem('player-lang',LANG)}catch{}}
  applyLang();
}
(function(){let l='';try{l=localStorage.getItem('player-lang')||''}catch{}
  if(!l){l=((navigator.language||'en').slice(0,2)).toLowerCase()}
  LANG=D[l]?l:'en'})();

/* ===== Modal / URL loader ===== */
let mMode='video';
function openModal(mode,err){
  if(fsEl())exitFs();
  closeMenu();mMode=mode||'video';
  modalText();
  urlIn.value='';mErr.textContent=err||'';
  cancelBtn.hidden=mMode==='video'&&!S.has;fileBtn.hidden=mMode!=='video';
  modal.classList.add('open');setTimeout(()=>urlIn.focus(),0);
}
function closeModal(){modal.classList.remove('open');showControls()}
function submitUrl(){
  const raw=urlIn.value.trim();let u;
  try{u=new URL(raw)}catch{mErr.textContent=t('Enter a valid URL, for example https://example.com/video.mp4');return}
  if(!/^(https?|blob):$/.test(u.protocol)){mErr.textContent=t('Only http, https or blob URLs are supported.');return}
  if(u.protocol==='http:'&&location.protocol==='https:'){mErr.textContent=t('This page is served over HTTPS, so the browser blocks plain http links. Use an https link.');return}
  closeModal();mMode==='video'?load(u.href):loadSubUrl(u.href);

    items.push({label:t('Subtitle language'),hint:sl,radio:false,fn:()=>openMenu('sl',t('Subtitle language'),captionItems(),openSettings)});
  }
  if(emb&&S.isYt)items.push({label:t('Subtitle language'),hint:S.ytLang?(YTLANGS.find(x=>x[0]===S.ytLang)||[])[1]:t('Subtitles: default'),radio:false,fn:()=>openMenu('yl',t('Subtitle language'),YTLANGS.map(([c,n])=>({label:n||t('Subtitles: default'),on:S.ytLang===c,fn:()=>{S.ytLang=c;try{localStorage.setItem('player-ytlang',c)}catch{}const em=S.src&&embedFor(S.src);if(em)ifr.src=em.src;closeMenu()}})),openSettings)});
  if(q)items.push({label:t('Quality'),hint:S.hls.autoLevelEnabled?t('Auto'):(S.hls.levels[S.hls.currentLevel]||{}).height+'p',radio:false,fn:()=>openMenu('q',t('Quality'),[{label:t('Auto'),on:S.hls.autoLevelEnabled,fn:()=>{S.hls.currentLevel=-1;closeMenu()}},...S.hls.levels.map((l,i)=>({label:(l.height||Math.round(l.bitrate/1000)+'k')+(l.height?'p':''),on:!S.hls.autoLevelEnabled&&S.hls.currentLevel===i,fn:()=>{S.hls.currentLevel=i;closeMenu()}}))],openSettings)});
  if(!emb){
    items.push({label:t('Caption size'),radio:false,fn:()=>openMenu('cs',t('Caption size'),sizes.map(([l,s])=>({label:t(l),on:cur===s,fn:()=>{player.style.setProperty('--cap-size',s);openSettings()}})),openSettings)});
    items.push({label:t('Caption background'),radio:false,fn:()=>openMenu('cb',t('Caption background'),bgs.map(([l,o])=>({label:t(l),on:bg===o,fn:()=>{player.style.setProperty('--cap-bg',o);openSettings()}})),openSettings)});
  }
  openMenu('set',t('Settings'),items);
}

/* ===== Subtitles ===== */
const tracks=()=>Array.from(v.textTracks).filter(t=>/subtitles|captions/.test(t.kind));
function clean(s){
  s=String(s).replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<(?!\/?[biu]>)[^>]*>/gi,'');
  return s.split(/(<\/?[biu]>)/gi).map((p,i)=>i%2?p.toLowerCase():esc(p)).join('');
}
function onCue(){
  const t=S.ccTrack,c=t&&t.activeCues?Array.from(t.activeCues):[];
  cap.innerHTML=c.map(x=>clean(x.text)).join('<br>');cap.classList.toggle('on',c.length>0);
}
function selectTrack(t){
  tracks().forEach(x=>{x.removeEventListener('cuechange',onCue);if(x!==t)x.mode='disabled'});
  S.ccTrack=t||null;S.ccOn=!!t;
  if(t){t.mode='hidden';t.addEventListener('cuechange',onCue);onCue()}else{cap.innerHTML='';cap.classList.remove('on')}
  ccBtn.classList.toggle('act',S.ccOn);ccBtn.setAttribute('aria-pressed',S.ccOn);
}
v.textTracks.addEventListener('addtrack',e=>{setTimeout(applyPrefs,0);if(e.track.mode==='showing'&&/subtitles|captions/.test(e.track.kind))selectTrack(e.track)});
function toggleCaptions(){
  if(S.ccOn){selectTrack(null);toast(t('Captions off'))}
  else{const k=S.ccTrack||tracks()[0];if(k){selectTrack(k);toast(t('Captions on'))}else toast(t('No captions available'))}
}
function captionItems(){
  const items=[{label:t('Off'),on:!S.ccOn,fn:()=>{selectTrack(null);setPref('player-slang','');closeMenu()}}];
  tracks().forEach((x,i)=>items.push({label:x.label||lname(x.language)||t('Track')+' '+(i+1),on:S.ccTrack===x&&S.ccOn,fn:()=>{selectTrack(x);setPref('player-slang',base(x.language));closeMenu()}}));
  items.push({label:t('Load subtitle file'),radio:false,fn:()=>{closeMenu();E('sfile').click()}});
  items.push({label:t('Load subtitle from URL'),radio:false,fn:()=>openModal('sub')});
  return items;
}
function openCaptionsMenu(){openMenu('cc',t('Captions'),captionItems())}
function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{return new TextDecoder('windows-1252').decode(buf)}}
function addSub(text,name){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  if(!/^WEBVTT/.test(text))text='WEBVTT\n\n'+text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2');
  const url=URL.createObjectURL(new Blob([text],{type:'text/vtt'}));S.blobs.push(url);
  const el=document.createElement('track');el.kind='subtitles';el.label=name;el.srclang='und';el.src=url;v.append(el);
  selectTrack(el.track);toast(t('Subtitles loaded')+': '+name);
}
E('sfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{addSub(decode(await f.arrayBuffer()),f.name)}catch{toast(t('Could not read the subtitle file'))}};
async function loadSubUrl(u){
  try{const r=await fetch(u);if(!r.ok)throw 0;addSub(decode(await r.arrayBuffer()),u.split('/').pop().split('?')[0]||t('Subtitles'))}
  catch{toast(t('Could not load subtitles. The server may block cross-origin requests.'))}
}

/* ===== Audio tracks & extras ===== */
const lname=c=>{if(!c)return '';try{return new Intl.DisplayNames([LANG],{type:'language'}).of(String(c).split('-')[0])||c}catch{return c}};
const getPref=k=>{try{return localStorage.getItem(k)||''}catch{return ''}};
const setPref=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const base=c=>String(c||'').toLowerCase().split('-')[0];
function audioList(){
  const h=S.hls;
  if(h&&h.audioTracks&&h.audioTracks.length>1)return h.audioTracks.map((x,i)=>({label:x.name||lname(x.lang)||t('Track')+' '+(i+1),on:h.audioTrack===i,fn:()=>{h.audioTrack=i;setPref('player-alang',base(x.lang));closeMenu()}}));
  const a=v.audioTracks;
  if(a&&a.length>1)return Array.from(a).map((x,i)=>({label:x.label||lname(x.language)||t('Track')+' '+(i+1),on:x.enabled,fn:()=>{Array.from(a).forEach((y,j)=>y.enabled=j===i);setPref('player-alang',base(x.language));closeMenu()}}));
  return [];
}
function audioItems(){const l=audioList();return l.length?l:[{label:t('Only one audio track in this video'),radio:false,fn:()=>closeMenu()}]}
function applyPrefs(){
  const pa=getPref('player-alang');
  if(pa){const h=S.hls;
    if(h&&h.audioTracks&&h.audioTracks.length>1){const i=h.audioTracks.findIndex(x=>base(x.lang)===pa);if(i>=0&&h.audioTrack!==i)h.audioTrack=i}
    else{const a=v.audioTracks;if(a&&a.length>1){const arr=Array.from(a),i=arr.findIndex(x=>base(x.language)===pa);if(i>=0)arr.forEach((y,j)=>y.enabled=j===i)}}}
  const ps=getPref('player-slang');
  if(ps&&!S.ccOn){const tr=tracks().find(x=>base(x.language)===ps);if(tr)selectTrack(tr)}
}
function updateExtras(){audioBtn.hidden=!S.has;applyPrefs();pipBtn.hidden=!(document.pictureInPictureEnabled&&S.has)}
if(v.audioTracks&&v.audioTracks.addEventListener){v.audioTracks.addEventListener('addtrack',updateExtras);v.audioTracks.addEventListener('removetrack',updateExtras)}
pipBtn.onclick=()=>{(document.pictureInPictureElement?document.exitPictureInPicture():v.requestPictureInPicture()).catch(()=>toast(t('Picture in picture is unavailable')))};

/* ===== Fullscreen & orientation ===== */
async function enterFs(){try{if(player.requestFullscreen)await player.requestFullscreen();else if(player.webkitRequestFullscreen)player.webkitRequestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}catch{}}
function exitFs(){try{const p=(document.exitFullscreen||document.webkitExitFullscreen).call(document);p&&p.catch&&p.catch(()=>{})}catch{}}
const lockLand=async()=>{try{await screen.orientation.lock('landscape')}catch{}};
const unlock=()=>{try{screen.orientation.unlock()}catch{}};
E('fs').onclick=()=>fsEl()?exitFs():enterFs();
E('rot').onclick=()=>{if(fsEl()){exitFs();unlock()}else{enterFs();lockLand()}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  const on=!!fsEl();setIc(fsIc,on?'fsx':'fs');E('fs').setAttribute('aria-label',t(on?'Exit fullscreen':'Fullscreen'));if(!on)unlock();showControls()}));
function onOrient(){
  if(!S.has||!matchMedia('(pointer:coarse)').matches)return;
  const land=screen.orientation?screen.orientation.type.startsWith('landscape'):innerWidth>innerHeight;
  if(land&&!v.paused&&!fsEl()){enterFs();lockLand()}else if(!land&&fsEl()){exitFs();unlock()}
}
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',onOrient);
window.addEventListener('orientationchange',onOrient);

/* ===== Keyboard ===== */
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='Escape'){if(modalOpen()){closeModal()}else if(menuOpen())closeMenu();return}
  if(modalOpen()||e.ctrlKey||e.metaKey||e.altKey||!S.has)return;
  const t=e.target;if(t.tagName==='INPUT'&&t.type!=='range'&&t.type!=='file')return;
  if(t.closest&&t.closest('.menu')&&(k==='ArrowDown'||k==='ArrowUp')){
    e.preventDefault();const b=Array.from(menuEl.querySelectorAll('button')),i=b.indexOf(t);b[(i+(k==='ArrowDown'?1:b.length-1))%b.length].focus();return}
  if(t.closest&&t.closest('.menu'))return;
  if(t.tagName==='INPUT'&&t.type==='range'&&(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'))return;
  showControls();
  const onBtn=t.closest&&t.closest('button');let h=true;
  if(k===' '||k==='k'||k==='K'){if(k===' '&&onBtn)return;togglePlay()}
  else if(k==='ArrowLeft')seekBy(-5);else if(k==='ArrowRight')seekBy(5);
  else if(k==='j'||k==='J')seekBy(-10);else if(k==='l'||k==='L')seekBy(10);
  else if(k==='ArrowUp'){setVol(S.vol+.05);showInd('vol');hideInd()}
  else if(k==='ArrowDown'){setVol(S.vol-.05);showInd('vol');hideInd()}
  else if(k==='m'||k==='M')toggleMute();
  else if(k==='f'||k==='F')fsEl()?exitFs():enterFs();
  else if(k==='c'||k==='C')toggleCaptions();
  else if(k==='<'||k==='>'){const i=RATES.indexOf(S.rate);setRate(RATES[clamp(i+(k==='>'?1:-1),0,RATES.length-1)])}
  else if(/^[0-9]$/.test(k)&&dur())v.currentTime=dur()*(+k)/10;
  else h=false;
  if(h)e.preventDefault();
});

/* ===== Init ===== */
syncVol();updPlay();applyLang();requestAnimationFrame(tick);
if(!window.Hls)console.warn('hls.js not loaded: HLS streams use native playback only.');
setTimeout(()=>urlIn.focus(),0);
})();
</script>
